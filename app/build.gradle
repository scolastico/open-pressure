plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'org.openpressure.app'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'org.openpressure.app'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'org.openpressure.app.pdf.PdfReportInstrumentation'
        versionCode 10
        versionName '1.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        // tools/omron-sandbox.sh narrows the shared fixture replay with -Dfixture=<name>.
        unitTests.all { systemProperty 'fixture', System.getProperty('fixture','') }
    }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
dependencies {
    implementation project(':protocol')
    testImplementation testFixtures(project(':protocol'))
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.mockito:mockito-core:5.20.0'
}
